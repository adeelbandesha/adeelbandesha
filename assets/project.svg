<text x="52" y="202" font-size="15.5" fill="#9AA5C0">A mobile app for reading and memorizing the Quran. It renders</text>
<text x="52" y="227" font-size="15.5" fill="#9AA5C0">real Mushaf pages from the original glyph fonts, so every page</text>
<text x="52" y="252" font-size="15.5" fill="#9AA5C0">matches the printed copy. I'm building both the React Native</text>
<text x="52" y="277" font-size="15.5" fill="#9AA5C0">app and the Node.js API behind it.</text>
