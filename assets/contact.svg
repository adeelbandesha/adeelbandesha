<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" fill="none">
<defs>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090E1C"/><stop offset="1" stop-color="#111A38"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity="0.045"/></pattern>
<clipPath id="clip"><rect width="1000" height="230" rx="24"/></clipPath>
</defs>
<style>
text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
.mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }

</style>
<rect width="1000" height="230" rx="24" fill="url(#bg)"/><g clip-path="url(#clip)">
<rect width="1000" height="230" fill="url(#grid)"/>
<circle cx="120.0" cy="23.0" r="170" fill="#8B5CF6" fill-opacity="0.32" filter="url(#blur)">
  <animateTransform attributeName="transform" type="translate" values="0 0;30 20;0 0" dur="14s" repeatCount="indefinite"/></circle>
<circle cx="900.0" cy="218.5" r="190" fill="#22D3EE" fill-opacity="0.18" filter="url(#blur)">
  <animateTransform attributeName="transform" type="translate" values="0 0;-30 -15;0 0" dur="16s" repeatCount="indefinite"/></circle>
</g><rect x="0.5" y="0.5" width="999" height="229" rx="24" stroke="#FFFFFF" stroke-opacity="0.08"/>
<rect x="1" y="1" width="998" height="228" rx="24" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="1.5"/>
<rect x="435.5" y="40" width="129.1" height="28" rx="14" fill="#22D3EE" fill-opacity="0.08" stroke="#22D3EE" stroke-opacity="0.35"/>
<text x="500.0" y="58.5" text-anchor="middle" class="mono" font-size="11.5" letter-spacing="1.5" font-weight="600" fill="#22D3EE">GET IN TOUCH</text>
<text x="500.0" y="122" text-anchor="middle" font-size="34" font-weight="800" fill="#E8ECF5" letter-spacing="-0.5">Have a role or a product <tspan fill="url(#accent)">in mind?</tspan></text>
<text x="500.0" y="160" text-anchor="middle" font-size="16" fill="#9AA5C0">Whether it's a full stack role or a freelance project, I'd be glad to hear about it.</text>
<text x="500.0" y="184" text-anchor="middle" font-size="16" fill="#9AA5C0">LinkedIn or email is the quickest way to reach me.</text>
</svg>