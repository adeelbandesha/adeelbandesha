<rect width="1000" height="370" rx="24" fill="url(#bg)"/><rect x="0.5" y="0.5" width="999" height="369" rx="24" stroke="#FFFFFF" stroke-opacity="0.08"/>
<g clip-path="url(#clip)"><circle cx="80" cy="0" r="160" fill="#8B5CF6" fill-opacity="0.18" filter="url(#blur)"/></g>
<text x="48" y="70" font-size="16" fill="#E8ECF5">I'm a senior full stack engineer at Genius Mind Zone. I work across</text>
<text x="48" y="96" font-size="16" fill="#E8ECF5">the whole product: React and Next.js on the web, React Native and</text>
<text x="48" y="124" font-size="16" fill="#E8ECF5">Expo on mobile, and Node.js, TypeScript and Python on the server.</text>
<text x="48" y="164" font-size="16" fill="#9AA5C0">A growing part of my work is AI and machine learning, from</text>
<text x="48" y="192" font-size="16" fill="#9AA5C0">computer vision models to LLM-powered features inside production</text>
<text x="48" y="218" font-size="16" fill="#9AA5C0">apps.</text>
<text x="48" y="260" font-size="16" fill="#9AA5C0">I like owning a feature from the first screen to the last database</text>
<text x="48" y="286" font-size="16" fill="#9AA5C0">query, and I try to leave code the next developer can pick up</text>
<text x="48" y="314" font-size="16" fill="#9AA5C0">without a long handover.</text>
<rect x="640" y="24" width="312" height="322" rx="16" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.07"/>
