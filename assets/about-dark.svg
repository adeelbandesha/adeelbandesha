<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" fill="none"><style>@font-face{font-family:'p-serifR';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'p-sans';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'p-mono';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'p-sansM';src:url(data:font/woff2;base64,) format('woff2');}.ink{fill:#EDE9E2}.muted{fill:#ABA59A}.faint{fill:#7A756C}.acc{fill:#E08A5B}.rl{stroke:#2E2C28}.rl2{stroke:#45423C}.blk{fill:#17161A}.btn{fill:#EDE9E2}.btxt{fill:#111111}.sacc{stroke:#E08A5B}.sink{stroke:#EDE9E2}text{font-kerning:normal;text-rendering:geometricPrecision}</style><text x="0.0" y="46.0" font-family="p-serifR" font-size="25" class="ink" letter-spacing="-0.2">I'm a full stack engineer who enjoys owning a feature</text>
<text x="0.0" y="81.0" font-family="p-serifR" font-size="25" class="ink" letter-spacing="-0.2">from the first screen to the last database query.</text>
<text x="0.0" y="130.0" font-family="p-sans" font-size="16.5" class="muted">Day to day I work across React and Next.js on the web, React Native and</text>
<text x="0.0" y="158.0" font-family="p-sans" font-size="16.5" class="muted">Expo on mobile, and Node.js, TypeScript and Python on the server. More of</text>
<text x="0.0" y="186.0" font-family="p-sans" font-size="16.5" class="muted">my recent work involves AI and machine learning, from computer vision to</text>
<text x="0.0" y="214.0" font-family="p-sans" font-size="16.5" class="muted">LLM-powered features in production apps.</text>
<text x="0.0" y="258.0" font-family="p-sans" font-size="16.5" class="muted">I care about clear code and calm releases, and I try to leave things in a state</text>
<text x="0.0" y="286.0" font-family="p-sans" font-size="16.5" class="muted">the next developer can pick up without a long handover.</text>
